<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Brand</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <div class="logo" data-editable="logo-text">Brand</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="page-content">
        <div class="container">
            <h1 data-editable="contact-page-title">Contact Us</h1>
            <p class="subtitle" data-editable="contact-page-subtitle">We'd love to hear from you</p>

            <div class="contact-wrapper">
                <div class="contact-info animate fade-in-left">
                    <h2 data-editable="contact-section-title">Get In Touch</h2>
                    <div class="info-item">
                        <span class="info-icon">&#9993;</span>
                        <div>
                            <h4>Email</h4>
                            <p data-editable="contact-email">hello@brand.com</p>
                        </div>
                    </div>
                    <div class="info-item">
                        <span class="info-icon">&#9742;</span>
                        <div>
                            <h4>Phone</h4>
                            <p data-editable="contact-phone">+1 (555) 123-4567</p>
                        </div>
                    </div>
                    <div class="info-item">
                        <span class="info-icon">&#128205;</span>
                        <div>
                            <h4>Address</h4>
                            <p data-editable="contact-address">123 Main Street<br>New York, NY 10001</p>
                        </div>
                    </div>
                </div>

                <form class="contact-form animate fade-in-right" id="contactForm">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Send Message</button>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p data-editable="footer-text">&copy; 2026 Brand. All rights reserved.</p>
    </footer>

    <script>
        (function() {
            const saved = JSON.parse(localStorage.getItem('siteContent') || '{}');
            document.querySelectorAll('[data-editable]').forEach(el => {
                const key = el.getAttribute('data-editable');
                if (saved[key]) {
                    el.textContent = saved[key];
                }
            });
        })();
    </script>
    <script src="script.js"></script>
</body>
</html>
